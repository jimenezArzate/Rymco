<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión de Miembros</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-card">
        
        <div class="illustration-container">
            <div class="bg-circle"></div>
            
            <img src="producto_termi.jpg" alt="Inicio de sesión" class="user-image">

            <div class="shape shape-triangle-green"></div>
            <div class="shape shape-circle-blue"></div>
            <div class="shape shape-square-gray"></div>
            <div class="shape shape-triangle-green-down"></div>
            <div class="shape shape-circle-blue-small"></div>
        </div>

        <div class="form-container">
            <h2>Inicio de sesión de miembros</h2>
            
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Correo electrónico" required autocomplete="off">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                    <button type="button" id="togglePassword" class="toggle-password">Mostrar</button>
                </div>

                <button type="submit" class="btn-submit">ACCESO</button>

                <p id="errorMessage" class="error-msg"></p>

                <a href="#" class="forgot-link">¿Olvidaste tu nombre de usuario o contraseña?</a>
            </form>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
